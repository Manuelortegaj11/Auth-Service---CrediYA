server:
  port: 8080

spring:
  application:
    name: "AuthService"
  h2:
    console:
      enabled: false

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediya"
    schema: "public"
    username: "root"
    password: "progresoempresarial11"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
    endpoint:
      health:
        probes:
          enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: true

logging:
  level:
    org.springframework.data: DEBUG
    io.r2dbc: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    co.com.pragma.auth: DEBUG