server:
  port: 8080

spring:
  application:
    name: "AuthService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    tasks: "/api/v1/tasks"
    tasksById: "/api/v1/tasks/{id}"

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "postgres"   # 👈 recuerda que por defecto entras a esta DB
    schema: "public"
    username: "root"
    password: "progresoempresarial11"

